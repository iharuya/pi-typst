name: release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: pi-typst-release
  cancel-in-progress: false

jobs:
  stage:
    name: Stage to npm
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@9bbca1e9dc2902adb87e8780fe5c98796985a62d # v6.1.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          check-latest: true
          cache: pnpm
          registry-url: "https://registry.npmjs.org"

      - name: Validate tag matches package.json
        shell: bash
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION=$(node -p "require('./package.json').version")

          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "Error: Tag version ($TAG_VERSION) does not match package.json version ($PKG_VERSION)" >&2
            exit 1
          fi

      - name: Setup Typst
        uses: typst-community/setup-typst@00ad6338f0b34724ea002136bfb701a6c18585b0 # v5.3.2

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run checks
        run: pnpm check

      - name: Stage package (OIDC)
        run: |
          pnpm stage publish --access public --provenance
          echo "### ⏳ Package staged to npm. Please approve on [npmjs.com](https://www.npmjs.com/package/pi-typst/access) with 2FA." >> "$GITHUB_STEP_SUMMARY"
